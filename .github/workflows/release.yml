name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      server_version: ${{ steps.context.outputs.server_version }}
      icey_version: ${{ steps.context.outputs.icey_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release context
        id: context
        run: |
          echo "server_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "icey_version=$(tr -d '[:space:]' < ICEY_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout icey
        uses: actions/checkout@v7
        with:
          repository: auscaster/icey
          ref: ${{ steps.context.outputs.icey_version }}
          path: icey
          submodules: recursive

      - name: Validate release metadata
        run: bash ./scripts/validate-release-metadata.sh "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            cmake \
            dpkg-dev \
            gnupg \
            libssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            unzip zip

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: bash ./scripts/prepare-apt-signing.sh

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release package
        env:
          CC: gcc-13
          CXX: g++-13
          ICEY_SOURCE_DIR: ${{ github.workspace }}/icey
          BUILD_DIR: ${{ github.workspace }}/build-release
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: bash ./scripts/package-manager-check.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            icey-server-${{ steps.context.outputs.server_version }}-source.tar.gz
            icey-${{ steps.context.outputs.icey_version }}-source.tar.gz
            icey-server-${{ steps.context.outputs.server_version }}-Linux-x86_64.tar.gz
            icey-server-${{ steps.context.outputs.server_version }}-Linux-x86_64.zip
            icey-server-Linux-x86_64.tar.gz
            icey-server-Linux-x86_64.zip
            icey-server_${{ steps.context.outputs.server_version }}_amd64.deb
            icey-server-apt-repo-${{ steps.context.outputs.server_version }}.tar.gz
          fail_on_unmatched_files: true

      - name: Upload manifest bundle
        uses: actions/upload-artifact@v7
        with:
          name: package-managers-rendered
          path: .stage/package-managers/rendered
          include-hidden-files: true

      - name: Upload APT bundle
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: |
            .stage/apt-repo
            .stage/apt-public

      - name: Upload image inputs
        uses: actions/upload-artifact@v7
        with:
          name: icey-server-image-inputs
          path: |
            build-release/src/server/icey-server
            web/dist
            icey/data/test.mp4
            docker/entrypoint.sh
          if-no-files-found: error

  publish-image:
    runs-on: ubuntu-24.04
    needs: package-linux
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: icey-server-image-inputs
          path: .

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "DOCKERHUB_USERNAME is required to publish the 0state/icey-server image" >&2
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "DOCKERHUB_TOKEN is required to publish the 0state/icey-server image" >&2
            exit 1
          }

      - name: Derive image version
        id: image_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: 0state/icey-server
          tags: |
            type=raw,value=${{ steps.image_version.outputs.version }}
            type=raw,value=latest

      - name: Build image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          build-args: |
            ICEY_SERVER_BINARY=build-release/src/server/icey-server
            ICEY_WEB_ROOT=web/dist
            ICEY_SAMPLE_MEDIA=icey/data/test.mp4
            ICEY_ENTRYPOINT=docker/entrypoint.sh
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}

      - name: Smoke and publish the verified image
        env:
          IMAGE_VERSION: ${{ steps.image_version.outputs.version }}
        run: |
          docker run -d --name icey-release-smoke -p 127.0.0.1:14500:4500 "0state/icey-server:${IMAGE_VERSION}"
          trap 'docker rm -f icey-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:14500/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              docker logs icey-release-smoke
              exit 1
            fi
            sleep 1
          done
          docker rm -f icey-release-smoke >/dev/null
          docker push "0state/icey-server:${IMAGE_VERSION}"
          docker push 0state/icey-server:latest
          version_digest="$(docker buildx imagetools inspect "0state/icey-server:${IMAGE_VERSION}" | awk '/^Digest:/ {print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect 0state/icey-server:latest | awk '/^Digest:/ {print $2; exit}')"
          test -n "$version_digest"
          test "$version_digest" = "$latest_digest"
          echo "Verified 0state/icey-server:${IMAGE_VERSION} at ${version_digest}"

  publish-homebrew:
    runs-on: ubuntu-24.04
    needs: package-linux
    steps:
      - name: Check Homebrew publish credentials
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot publish Homebrew: HOMEBREW_TAP_TOKEN is not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: package-managers-rendered
          path: .stage/package-managers/rendered

      - name: Checkout tap repo
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: auscaster/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .stage/homebrew-tap

      - name: Publish formula
        if: steps.gate.outputs.publish == 'true'
        env:
          TAP_REPO_DIR: ${{ github.workspace }}/.stage/homebrew-tap
        run: bash ./scripts/publish-homebrew.sh

      - name: Commit formula update
        if: steps.gate.outputs.publish == 'true'
        run: |
          git -C .stage/homebrew-tap config user.name "github-actions[bot]"
          git -C .stage/homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .stage/homebrew-tap add Formula/icey-server.rb
          if git -C .stage/homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C .stage/homebrew-tap commit -m "chore(icey-server): publish ${{ needs.package-linux.outputs.server_version }}"
          git -C .stage/homebrew-tap push

  publish-apt-repo:
    runs-on: ubuntu-24.04
    needs: package-linux
    steps:
      - name: Check package repo credentials
        id: gate
        env:
          PACKAGES_REPO_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        run: |
          if [[ -n "${PACKAGES_REPO_TOKEN:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot publish APT: PACKAGES_REPO_TOKEN is not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: apt-repo
          path: .stage/apt-repo

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: package-managers-rendered
          path: .stage/package-managers/rendered

      - name: Checkout package repo
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: auscaster/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: .stage/packages

      - name: Publish APT repository
        if: steps.gate.outputs.publish == 'true'
        env:
          PACKAGES_REPO_DIR: ${{ github.workspace }}/.stage/packages
          APT_REPO_ROOT: ${{ github.workspace }}/.stage/apt-repo/apt-repo
          APT_PUBLIC_DIR: ${{ github.workspace }}/.stage/apt-repo/apt-public
          APT_LIST_SOURCE: ${{ github.workspace }}/.stage/package-managers/rendered/apt/icey-server.list
          APT_REPO_PATH: icey
          APT_BASE_URL: https://apt.auscaster.com/icey
        run: bash ./scripts/publish-apt-repo.sh

      - name: Commit package repo update
        if: steps.gate.outputs.publish == 'true'
        run: |
          git -C .stage/packages config user.name "github-actions[bot]"
          git -C .stage/packages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .stage/packages add .nojekyll index.html icey
          if git -C .stage/packages diff --cached --quiet; then
            exit 0
          fi
          git -C .stage/packages commit -m "chore(icey-server): publish ${{ needs.package-linux.outputs.server_version }}"
          git -C .stage/packages push

  publish-aur:
    runs-on: ubuntu-24.04
    needs: package-linux
    steps:
      - name: Check AUR publish credentials
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_PUBLISH_ENABLED: ${{ vars.AUR_PUBLISH_ENABLED }}
        run: |
          if [[ "${AUR_PUBLISH_ENABLED:-false}" != "true" ]]; then
            echo "Cannot publish AUR: AUR_PUBLISH_ENABLED is not enabled. Use make publish-aur AUR_REPO_DIR=/path/to/aur-icey-server for the local fallback." >&2
            exit 1
          elif [[ -n "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot publish AUR: AUR_SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          name: package-managers-rendered
          path: .stage/package-managers/rendered

      - name: Configure SSH
        if: steps.gate.outputs.publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Checkout AUR package
        if: steps.gate.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        run: git clone ssh://aur@aur.archlinux.org/icey-server.git .stage/aur-repo

      - name: Publish AUR package
        if: steps.gate.outputs.publish == 'true'
        env:
          AUR_REPO_DIR: ${{ github.workspace }}/.stage/aur-repo
        run: bash ./scripts/publish-aur.sh

      - name: Commit AUR update
        if: steps.gate.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        run: |
          git -C .stage/aur-repo config user.name "github-actions[bot]"
          git -C .stage/aur-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .stage/aur-repo add PKGBUILD .SRCINFO
          if git -C .stage/aur-repo diff --cached --quiet; then
            exit 0
          fi
          git -C .stage/aur-repo commit -m "chore(icey-server): publish ${{ needs.package-linux.outputs.server_version }}"
          git -C .stage/aur-repo push

  verify-distribution:
    runs-on: ubuntu-24.04
    needs: [package-linux, publish-image, publish-homebrew, publish-apt-repo, publish-aur]
    if: always() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read back owned package listings
        run: python3 scripts/check-distribution.py --strict
