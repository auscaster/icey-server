name: Docker Hub page

on:
  push:
    branches: [main]
    paths:
      - docker/legacy-dockerhub.md
      - .github/workflows/dockerhub-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: 0state/icey-server
          readme-filepath: docker/legacy-dockerhub.md
          short-description: Icey Server has moved to ghcr.io/auscaster/icey-server.
          enable-url-completion: true
